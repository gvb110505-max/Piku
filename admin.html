<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piku 관리자</title>
<style>
  :root{--bg:#0A0A0C;--card:#131318;--line:#23232B;--text:#F5F5F7;--sub:#96969E;--gold:#F2C558;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:14px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:24px;font-weight:900;font-style:italic}
  .tabs{display:flex;gap:4px;margin:20px 0;border-bottom:1px solid var(--line)}
  .tab{padding:10px 16px;color:var(--sub);font-weight:800;cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-bottom-color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .v{font-size:24px;font-weight:900;color:var(--gold);margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .muted{color:var(--sub);font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{color:var(--sub);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px}
  input.sm{width:80px}
  button{background:var(--gold);border:0;border-radius:8px;color:#111;font-weight:900;padding:8px 14px;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.warn{background:#2A1A1F;color:#FF7A7A;border:1px solid #4A2A33}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#F7DC8D,#C8992F)}
  .pill{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:900}
  .pill.on{background:#14291C;color:#5CFF9D}.pill.off{background:#2A1A1F;color:#FF7A7A}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .gate{max-width:360px;margin:120px auto;text-align:center}
  .gate input{width:100%;margin:16px 0 10px;padding:12px}
  .gate button{width:100%;padding:12px}
  .thumb{width:44px;height:60px;border-radius:6px;border:1px solid var(--line);background:#1A1A1A;object-fit:cover;display:block}
  .thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:9px;text-align:center;line-height:1.2}
  .imgcell{display:flex;align-items:center;gap:8px}
  #diag{display:none;text-align:left;white-space:pre-wrap;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;font-size:11px;line-height:1.6;color:var(--sub);max-height:50vh;overflow:auto}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:10px 20px;font-weight:800;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>PIKU 관리자</h1>
  <input id="tokenInput" type="password" placeholder="관리자 비밀번호" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
  <button onclick="login()">접속</button>
  <p class="muted" style="margin-top:10px">Vercel의 ADMIN_TOKEN 값 (기본: dev-admin)</p>
  <p class="muted" style="margin-top:4px">빌드 __BUILD__</p>
  <button class="ghost" style="margin-top:14px" onclick="diagnose()">서버 진단</button>
  <pre id="diag"></pre>
</div>

<div id="app" class="wrap" style="display:none">
  <h1>PIKU 관리자</h1>
  <div class="tabs">
    <div class="tab on" data-t="dash" onclick="go('dash')">대시보드</div>
    <div class="tab" data-t="packs" onclick="go('packs')">팩·상품</div>
    <div class="tab" data-t="ship" onclick="go('ship')">배송</div>
    <div class="tab" data-t="orders" onclick="go('orders')">주문·유저</div>
    <div class="tab" data-t="pay" onclick="go('pay')">결제 대사</div>
    <div class="tab" data-t="market" onclick="go('market')">마켓 검수</div>
    <div class="tab" data-t="settle" onclick="go('settle')">정산·정책</div>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script>
// 아이폰 자동변환/자동완성으로 붙는 앞뒤 공백·개행 제거 (비번 자체는 건드리지 않는다)
function clean(v){ return (v||'').trim(); }
// 사파리 프라이빗 모드에서는 localStorage 접근 자체가 예외를 던진다 → 감싼다
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} return null; }
var TOKEN = clean(store('admin_token'));
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(n){ return Number(n||0).toLocaleString('ko-KR'); }
function toast(m){ var t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){t.style.display='none';},2600); }

// API 베이스 자동 탐지.
// 배포 환경(Vercel)의 rewrite가 다단계 경로(/admin/overview)에서 깨지는 사례가 있어,
// rewrite를 거치지 않고 함수에 직접 붙는 '/api' 접두사를 대안으로 둔다.
// 두 후보를 /admin/ping으로 찔러보고 먼저 응답하는 쪽을 계속 사용한다.
var BASE = null;
var BASE_CANDIDATES = ['', '/api'];
function ensureBase(){
  if(BASE !== null) return Promise.resolve(BASE);
  var i = 0;
  function tryNext(){
    if(i >= BASE_CANDIDATES.length){ BASE = ''; return Promise.resolve(BASE); } // 전부 실패 → 원래 경로로 진행해 에러를 노출
    var c = BASE_CANDIDATES[i++];
    return fetch(c + '/admin/ping?_=' + Date.now(), { cache:'no-store' }).then(function(r){
      if(!r.ok) return tryNext();
      return r.text().then(function(t){
        try { if(JSON.parse(t).ok){ BASE = c; return BASE; } } catch(e){}
        return tryNext();
      });
    }, tryNext);
  }
  return tryNext();
}

// r.json()을 쓰면 서버가 JSON이 아닌 응답(플랫폼 HTML 오류 페이지, 504 등)을 줬을 때
// 사파리가 "The string did not match the expected pattern."이라는 정체불명 에러만 던진다.
// → 항상 text()로 받아서 직접 파싱하고, 실패하면 상태코드와 본문 앞부분을 그대로 노출한다.
function api(path, body){
  return ensureBase().then(function(base){ return apiAt(base, path, body); });
}
function apiAt(base, path, body){
  var url = base + path + (path.indexOf('?')>=0?'&':'?') + 'token=' + encodeURIComponent(TOKEN)
    + '&_=' + Date.now(); // 캐시 우회
  var opt = { method: body?'POST':'GET', cache:'no-store', headers:{} };
  if(body){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  return fetch(url,opt).then(function(r){
    return r.text().then(function(text){ return { status:r.status, ok:r.ok, text:text }; });
  },function(netErr){
    throw new Error('서버에 연결하지 못했어요 ('+(netErr&&netErr.message||netErr)+')');
  }).then(function(res){
    var data=null, parsed=true;
    try { data = JSON.parse(res.text); } catch(e){ parsed=false; }
    if(!parsed){
      throw new Error('서버가 JSON이 아닌 응답을 보냈어요 · HTTP '+res.status+' · '
        + (res.text ? res.text.replace(/\s+/g,' ').slice(0,180) : '(빈 응답)'));
    }
    if(res.status===403){ logout(); throw new Error('비밀번호가 올바르지 않아요 (서버가 거부)'); }
    if(!res.ok) throw new Error((data.message||data.error||'요청 실패')+' · HTTP '+res.status);
    return data;
  });
}

// 로그인이 안 될 때 원인을 계층별로 잘라서 보여준다: 라우팅 → DB → 토큰
function diagnose(){
  var box=document.getElementById('diag');
  box.style.display='block';
  box.textContent='진단 중...\n';
  var typed=clean(document.getElementById('tokenInput').value);
  function probe(label,path){
    return fetch(path+'&_='+Date.now(),{cache:'no-store'}).then(function(r){
      return r.text().then(function(t){
        box.textContent += '\n[' + label + '] HTTP ' + r.status + '\n'
          + (r.headers.get('content-type')||'(content-type 없음)') + '\n'
          + (t ? t.replace(/\s+/g,' ').slice(0,400) : '(빈 응답)') + '\n';
      });
    }).catch(function(e){
      box.textContent += '\n[' + label + '] 요청 실패: ' + (e&&e.message||e) + '\n';
    });
  }
  var q = 'token=' + encodeURIComponent(typed);
  box.textContent = 'page: ' + location.href + '\nBASE: ' + (BASE===null?'(미탐지)':(BASE||'(루트)')) + '\n';
  probe('health','/health?x=1')
    .then(function(){ return probe('rewrite 경로: /admin/ping', '/admin/ping?'+q); })
    .then(function(){ return probe('직접 경로: /api/admin/ping', '/api/admin/ping?'+q); })
    .then(function(){ return probe('rewrite 경로: /admin/overview', '/admin/overview?'+q); })
    .then(function(){ return probe('직접 경로: /api/admin/overview', '/api/admin/overview?'+q); })
    .then(function(){ box.textContent += '\n— 진단 끝. 이 내용을 그대로 복사해서 보내주세요.'; });
}
function login(){ TOKEN=clean($('#tokenInput').value); store('admin_token',TOKEN); boot(); }
function logout(){ store('admin_token',null); $('#app').style.display='none'; $('#gate').style.display='block'; }
function boot(){
  api('/admin/overview').then(function(){
    $('#gate').style.display='none'; $('#app').style.display='block';
    var d=$('#diag'); if(d) d.style.display='none';
    go('dash');
  }).catch(function(e){
    toast(e.message);
    var d=$('#diag');
    if(d){ d.style.display='block'; d.textContent='로그인 실패\n\n'+e.message
      +'\n\n원인이 명확하지 않으면 아래 "서버 진단"을 눌러 결과를 보내주세요.'; }
  });
}
function go(t){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on',tabs[i].dataset.t===t);
  ({dash:renderDash,packs:renderPacks,ship:renderShip,orders:renderOrders,pay:renderPay,market:renderMarket,settle:renderSettle})[t]();
}

function renderDash(){
  api('/admin/overview').then(function(o){
    var h='<div class="grid">'
      +'<div class="stat"><div class="muted">총 매출</div><div class="v">'+num(o.sales_total)+'원</div></div>'
      +'<div class="stat"><div class="muted">주문 수</div><div class="v">'+num(o.order_count)+'</div></div>'
      +'<div class="stat"><div class="muted">가입 유저</div><div class="v">'+num(o.user_count)+'</div></div>'
      +'<div class="stat"><div class="muted">미발송 배송</div><div class="v">'+num(o.pending_shipments)+'</div></div></div>';
    o.packs.forEach(function(p){
      var sold=p.sold_slots,total=p.total_slots,left=total-sold;
      var hitLeft=p.hits.reduce(function(s,x){return s+x.remaining;},0);
      h+='<div class="card"><h3>'+esc(p.name)
        +' <span class="pill '+(p.active?'on':'off')+'">'+(p.active?'판매중':'중단/품절')+'</span>'
        +' <span class="muted">'+(p.is_welcome?num(p.point_price)+'P 웰컴팩':num(p.price)+'원')+' · 주문 '+p.orders+'건</span></h3>'
        +'<div class="bar"><i style="width:'+(total?sold/total*100:0)+'%"></i></div>'
        +'<div class="muted" style="margin-top:6px">판매 '+sold+'/'+total+' 슬롯 · 남은 HIT '+hitLeft+'개</div>'
        +'<table><tr><th>HIT</th><th>잔여</th><th>확률</th><th>교환P</th></tr>';
      p.hits.forEach(function(x){
        h+='<tr><td>'+esc(x.name)+'</td><td>'+x.remaining+'/'+x.total_qty+'</td>'
          +'<td>'+(left>0?(x.remaining/left*100).toFixed(2):'0.00')+'%</td><td>'+num(x.point_value)+'P</td></tr>';
      });
      h+='</table></div>';
    });
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}

function renderPacks(){
  api('/admin/overview').then(function(o){
    var h='<div class="card"><h3>새 팩 만들기</h3><div class="row">'
      +'<input id="np_name" placeholder="팩 이름">'
      +'<input id="np_price" class="sm" type="number" placeholder="가격(원)">'
      +'<input id="np_slots" class="sm" type="number" placeholder="총 슬롯">'
      +'<button onclick="createPack()">생성</button></div>'
      +'<p class="muted" style="margin-top:8px">원가율 35% 설계: 총 슬롯 ≈ HIT 원가 합 ÷ (판매가 × 0.35)</p></div>';
    o.packs.forEach(function(p){
      h+='<div class="card"><h3>'+esc(p.name)+' <span class="pill '+(p.active?'on':'off')+'">'+(p.active?'판매중':'중단')+'</span></h3>'
        +'<div class="row">'+imgCell('pack',p.id,p.image)+'<label class="muted">팩 대표 이미지</label></div>'
        +'<div class="row"><label class="muted">총 슬롯</label>'
        +'<input class="sm" type="number" value="'+p.total_slots+'" id="slots_'+p.id+'">'
        +'<button class="ghost" onclick="updPack('+p.id+',{total_slots:+document.getElementById(\'slots_'+p.id+'\').value})">저장</button>'
        +'<button class="ghost" onclick="updPack('+p.id+',{active:'+(p.active?0:1)+'})">'+(p.active?'판매 중단':'판매 재개')+'</button></div>'
        +'<div class="row"><label class="muted">결제 링크</label>'
        +'<input style="min-width:320px" id="payurl_'+p.id+'" placeholder="비우면 결제 대사 탭의 공통 설정을 씁니다" value="'+esc(p.pay_url||'')+'">'
        +'<button class="ghost" onclick="updPack('+p.id+',{pay_url:document.getElementById(\'payurl_'+p.id+'\').value})">저장</button></div>'
        +'<table><tr><th>이미지</th><th>HIT</th><th>잔여</th><th>총량</th><th>교환P</th><th></th></tr>';
      p.hits.forEach(function(x){
        h+='<tr><td>'+imgCell('hit',x.id,x.image)+'</td><td>'+esc(x.name)+'</td>'
          +'<td><input class="sm" type="number" value="'+x.remaining+'" id="hr_'+x.id+'"></td>'
          +'<td><input class="sm" type="number" value="'+x.total_qty+'" id="ht_'+x.id+'"></td>'
          +'<td><input class="sm" type="number" value="'+x.point_value+'" id="hp_'+x.id+'"> P</td>'
          +'<td><button class="ghost" onclick="updHit('+x.id+')">저장</button></td></tr>';
      });
      h+='</table><div class="row"><input id="nh_name_'+p.id+'" placeholder="새 HIT 이름">'
        +'<input id="nh_qty_'+p.id+'" class="sm" type="number" placeholder="수량">'
        +'<input id="nh_pv_'+p.id+'" class="sm" type="number" placeholder="교환P">'
        +'<input id="nh_cost_'+p.id+'" class="sm" type="number" placeholder="원가">'
        +'<button onclick="addHit('+p.id+')">HIT 추가</button></div>'
        +'<table><tr><th>이미지</th><th>POINT 풀</th><th>등급</th><th>가중치</th><th></th></tr>';
      p.pool.forEach(function(c){
        h+='<tr><td>'+imgCell('pool',c.id,c.image)+'</td><td>'+esc(c.name)+'</td><td>'+c.rarity+'</td><td>'+c.weight+'</td>'
          +'<td><button class="warn" onclick="delPool('+c.id+')">삭제</button></td></tr>';
      });
      h+='</table><div class="row"><input id="pc_name_'+p.id+'" placeholder="카드 이름">'
        +'<select id="pc_r_'+p.id+'"><option value="common">커먼</option><option value="uncommon">언커먼</option><option value="rare">레어</option></select>'
        +'<input id="pc_w_'+p.id+'" class="sm" type="number" value="10">'
        +'<button onclick="addPool('+p.id+')">POINT 카드 추가</button></div></div>';
    });
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}
// ==================== 이미지 슬롯 ====================
// 원본을 그대로 올리면 DB가 금방 커진다 → 업로드 전에 브라우저에서 축소한다.
var IMG_MAX = 900;      // 긴 변 최대 픽셀
var IMG_QUALITY = 0.86;

// 슬롯 한 칸: 현재 이미지 미리보기 + 파일 선택 + 비우기
function imgCell(kind, id, url){
  var key = kind+'_'+id;
  var box = url
    ? '<img class="thumb" id="th_'+key+'" src="'+esc(url)+'" alt="">'
    : '<div class="thumb empty" id="th_'+key+'">없음</div>';
  return '<div class="imgcell">'+box
    + '<input type="file" accept="image/*" id="fi_'+key+'" style="display:none" '
    + 'onchange="pickImage(\''+kind+'\','+id+',this)">'
    + '<div style="display:flex;flex-direction:column;gap:4px">'
    + '<button class="ghost" style="padding:4px 9px;font-size:11px" '
    + 'onclick="document.getElementById(\'fi_'+key+'\').click()">'+(url?'교체':'등록')+'</button>'
    + (url ? '<button class="warn" style="padding:4px 9px;font-size:11px" onclick="clearImage(\''+kind+'\','+id+')">비우기</button>' : '')
    + '</div></div>';
}

// 파일 → 캔버스 축소 → data URL
function shrink(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onerror = function(){ reject(new Error('파일을 읽지 못했어요.')); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ reject(new Error('이미지 형식을 인식하지 못했어요.')); };
      im.onload = function(){
        var w = im.width, hgt = im.height;
        var scale = Math.min(1, IMG_MAX / Math.max(w, hgt));
        var cw = Math.round(w * scale), ch = Math.round(hgt * scale);
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(im, 0, 0, cw, ch);
        // PNG는 투명도가 있을 수 있으나 카드 아트는 불투명이라 JPEG가 훨씬 작다
        resolve(cv.toDataURL('image/jpeg', IMG_QUALITY));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function pickImage(kind, id, input){
  var file = input.files && input.files[0];
  if(!file) return;
  input.value = '';   // 같은 파일을 다시 골라도 change가 뜨게
  toast('이미지 처리 중...');
  shrink(file).then(function(dataUrl){
    return api('/admin/images', { data: dataUrl, label: kind+'#'+id });
  }).then(function(r){
    return setImage(kind, id, r.url).then(function(){
      toast('이미지 등록됨 ('+Math.round(r.bytes/1024)+'KB)');
    });
  }).catch(function(e){ toast(e.message); });
}

function clearImage(kind, id){
  if(!confirm('이 칸의 이미지를 비웁니다.')) return;
  setImage(kind, id, '').then(function(){ toast('이미지 비움'); }).catch(function(e){ toast(e.message); });
}

// 종류별로 저장 경로가 다르다
function setImage(kind, id, url){
  var path = kind === 'pack' ? '/admin/packs/'+id
           : kind === 'hit'  ? '/admin/hits/'+id
           : '/admin/pool/'+id;
  return api(path, { image: url }).then(function(){ renderPacks(); });
}

function createPack(){
  api('/admin/packs',{name:$('#np_name').value,price:+$('#np_price').value,total_slots:+$('#np_slots').value})
    .then(function(){toast('팩 생성 완료');renderPacks();}).catch(function(e){toast(e.message);});
}
function updPack(id,body){ api('/admin/packs/'+id,body).then(function(){toast('저장됨');renderPacks();}).catch(function(e){toast(e.message);}); }
function updHit(id){
  api('/admin/hits/'+id,{remaining:+document.getElementById('hr_'+id).value,
    total_qty:+document.getElementById('ht_'+id).value,point_value:+document.getElementById('hp_'+id).value})
    .then(function(){toast('HIT 저장됨');renderPacks();}).catch(function(e){toast(e.message);});
}
function addHit(pid){
  api('/admin/packs/'+pid+'/hits',{name:document.getElementById('nh_name_'+pid).value,
    total_qty:+document.getElementById('nh_qty_'+pid).value,point_value:+document.getElementById('nh_pv_'+pid).value,
    cost:+document.getElementById('nh_cost_'+pid).value||0})
    .then(function(){toast('HIT 추가됨');renderPacks();}).catch(function(e){toast(e.message);});
}
function addPool(pid){
  api('/admin/packs/'+pid+'/pool',{name:document.getElementById('pc_name_'+pid).value,
    rarity:document.getElementById('pc_r_'+pid).value,weight:+document.getElementById('pc_w_'+pid).value||1})
    .then(function(){toast('추가됨');renderPacks();}).catch(function(e){toast(e.message);});
}
function delPool(id){ api('/admin/pool/'+id+'/delete',{}).then(function(){toast('삭제됨');renderPacks();}).catch(function(e){toast(e.message);}); }

function verifyUser(id){
  var b=clean(document.getElementById('vb_'+id).value);
  if(!/^(19|20)\d{6}$/.test(b)) return toast('생년월일 8자리를 입력하세요 (예: 19900101)');
  if(!confirm('신분증 등으로 실제 확인한 생년월일만 등록하세요. 결제 한도 판정에 그대로 쓰입니다.')) return;
  api('/admin/users/'+id+'/verify',{birth:b,memo:'관리자 수동 확인'})
    .then(function(r){toast(r.is_minor?'등록됨 (미성년자)':'등록됨 (성인)');renderOrders();})
    .catch(function(e){toast(e.message);});
}

function renderShip(){
  api('/admin/shipments').then(function(rows){
    var label={requested:'신청 접수',preparing:'준비 중',shipped:'발송 완료'};
    var h= rows.length? '' : '<p class="muted">배송 신청이 없어요</p>';
    rows.forEach(function(s){
      var cards=s.cards.map(function(c){return '<span class="pill" style="background:#1D1D26;color:var(--text);margin-right:6px">'+esc(c.name)+' ('+c.grade+')</span>';}).join('');
      h+='<div class="card"><h3>#'+s.id+' · '+esc(s.nickname)+' <span class="muted">'+esc(s.phone)+'</span>'
        +' <span class="pill '+(s.status==='shipped'?'on':'off')+'">'+(label[s.status]||s.status)+'</span></h3>'
        +'<div class="muted" style="margin-top:6px">'+esc(s.address)+' · 배송비 '+num(s.fee)+'원</div>'
        +'<div style="margin-top:8px">'+cards+'</div>'
        +'<div class="row"><input id="trk_'+s.id+'" placeholder="운송장 번호" value="'+esc(s.tracking||'')+'">'
        +'<button class="ghost" onclick="shipUpd('+s.id+',\'preparing\')">준비 중</button>'
        +'<button onclick="shipUpd('+s.id+',\'shipped\')">발송 완료</button></div></div>';
    });
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}
function shipUpd(id,status){
  api('/admin/shipments/'+id,{status:status,tracking:document.getElementById('trk_'+id).value||null})
    .then(function(){toast('배송 상태 변경됨');renderShip();}).catch(function(e){toast(e.message);});
}

function renderOrders(){
  Promise.all([api('/admin/orders'),api('/admin/users')]).then(function(res){
    var orders=res[0],users=res[1];
    var h='<div class="card"><h3>최근 주문</h3><table><tr><th>#</th><th>유저</th><th>팩</th><th>금액</th><th>수단</th></tr>';
    orders.forEach(function(o){
      h+='<tr><td>'+o.id+'</td><td>'+esc(o.nickname)+'</td><td>'+esc(o.pack_name)+'</td><td>'+num(o.amount)+'원</td><td>'+esc(o.method)+'</td></tr>';
    });
    var unver=users.filter(function(u){return !u.verified_by;}).length;
    h+='</table></div><div class="card"><h3>유저 '
      +'<span class="pill '+(unver?'off':'on')+'">본인확인 미완료 '+unver+'명</span></h3>'
      +'<p class="muted" style="margin-top:6px">본인확인이 없으면 생년월일을 신뢰할 수 없어 미성년자 한도(10만원/일)가 적용됩니다.</p>'
      +'<table><tr><th>#</th><th>닉네임</th><th>전화</th><th>본인확인</th><th>포인트</th><th>누적 결제</th><th></th></tr>';
    users.forEach(function(u){
      var vlabel={pass:'PASS',admin_manual:'관리자 확인',dev:'개발'}[u.verified_by]||null;
      h+='<tr><td>'+u.id+'</td><td>'+esc(u.nickname)+'</td><td class="muted">'+esc(u.phone)+'</td>'
        +'<td>'+(vlabel?'<span class="pill on">'+vlabel+' '+esc(u.birth||'')+'</span>'
                      :'<span class="pill off">미완료</span>')+'</td>'
        +'<td>'+num(u.points)+'P</td><td>'+num(u.spent)+'원</td>'
        +'<td><input class="sm" id="vb_'+u.id+'" placeholder="19900101" style="width:90px">'
        +'<button class="ghost" onclick="verifyUser('+u.id+')">인증 등록</button></td></tr>';
    });
    h+='</table></div>';
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}

// ==================== 마켓 (통신판매중개 / 검수) ====================
var MK_STATUS={paid:'결제완료·에스크로',awaiting_inbound:'입고 대기',inbound:'입고됨',
  inspecting:'검수 중',passed:'검수 합격',failed:'검수 불합격',shipped:'구매자 발송',
  completed:'거래 완료',refunded:'환불 완료'};
var IN_STATUS={requested:'수거 신청',picked_up:'수거됨',received:'입고 완료',
  unmatched:'미매칭',discarded:'폐기'};
var MK_ORDERS=[]; // 미매칭 매칭용 후보 캐시

function renderMarket(){
  Promise.all([api('/admin/market/overview'),api('/admin/market/inbound'),api('/admin/market/orders')])
  .then(function(r){
    var ov=r[0],inb=r[1],orders=r[2];
    MK_ORDERS=orders;

    var h='<div class="grid">'
      +'<div class="stat"><div class="muted">거래액(GMV)</div><div class="v">'+num(ov.gmv)+'원</div></div>'
      +'<div class="stat"><div class="muted">수수료 수익</div><div class="v">'+num(ov.fee_revenue)+'원</div></div>'
      +'<div class="stat"><div class="muted">판매중 상품</div><div class="v">'+num(ov.active_listings)+'</div></div>'
      +'<div class="stat"><div class="muted">미매칭 입고</div><div class="v">'+num(ov.unmatched_inbound)+'</div></div></div>';

    // --- 입고 스캔 ---
    h+='<div class="card"><h3>입고 스캔</h3>'
      +'<p class="muted" style="margin-top:6px">박스에 적힌 접수번호(PK____) 또는 판매자 Piku 아이디·닉네임·전화번호를 입력하세요.</p>'
      +'<div class="row"><input id="mk_code" placeholder="예: PKA3D7XQ 또는 판매왕" style="flex:1;min-width:200px" '
      +'autocapitalize="characters" autocorrect="off" spellcheck="false">'
      +'<button onclick="mkReceive()">입고 처리</button></div>'
      +'<div id="mk_scan_result"></div></div>';

    // --- 미매칭 입고함 ---
    var un=inb.filter(function(i){return i.status==='unmatched';});
    h+='<div class="card"><h3>미매칭 입고함 <span class="pill '+(un.length?'off':'on')+'">'+un.length+'건</span></h3>';
    if(!un.length) h+='<p class="muted" style="margin-top:6px">아이디를 알아볼 수 없는 박스가 없습니다.</p>';
    un.forEach(function(i){
      h+='<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">'
        +'<div>박스 표기: <b>'+esc(i.inbound_code||'(없음)')+'</b> <span class="muted">'+esc(i.received_at||'')+'</span></div>'
        +'<div class="row"><select id="mk_match_'+i.id+'">'+mkOrderOptions()+'</select>'
        +'<button onclick="mkMatch('+i.id+')">이 주문에 매칭</button></div></div>';
    });
    h+='</div>';

    // --- 검수 대기 ---
    var insp=orders.filter(function(o){return o.status==='inbound'||o.status==='inspecting';});
    h+='<div class="card"><h3>검수 대기 <span class="pill '+(insp.length?'off':'on')+'">'+insp.length+'건</span></h3>';
    if(!insp.length) h+='<p class="muted" style="margin-top:6px">검수 대기 건이 없습니다.</p>';
    insp.forEach(function(o){
      h+='<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">'
        +'<div><b>'+esc(o.title)+'</b> <span class="muted">'+esc(o.order_uid)+'</span></div>'
        +'<div class="muted">판매 '+esc(o.seller_nickname)+' → 구매 '+esc(o.buyer_nickname)
        +' · 거래가 '+num(o.item_price)+'원 · 정산 예정 '+num(o.payout_amount)+'원</div>'
        +'<div class="row"><input id="mk_reason_'+o.id+'" placeholder="불합격 사유" style="flex:1;min-width:160px">'
        +'<button onclick="mkInspect('+o.id+',\'pass\')">합격</button>'
        +'<button class="warn" onclick="mkInspect('+o.id+',\'fail\')">불합격</button></div></div>';
    });
    h+='</div>';

    // --- 출고 대기 (합격) ---
    var ship=orders.filter(function(o){return o.status==='passed';});
    h+='<div class="card"><h3>출고 대기 <span class="pill '+(ship.length?'off':'on')+'">'+ship.length+'건</span></h3>';
    if(!ship.length) h+='<p class="muted" style="margin-top:6px">출고 대기 건이 없습니다.</p>';
    ship.forEach(function(o){
      h+='<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">'
        +'<div><b>'+esc(o.title)+'</b> <span class="muted">'+esc(o.order_uid)+'</span></div>'
        +'<div class="muted">'+esc(o.buyer_nickname)+' · '+esc(o.buyer_address||'')+'</div>'
        +'<div class="row"><input id="mk_trk_'+o.id+'" placeholder="출고 송장번호" style="flex:1;min-width:160px">'
        +'<button onclick="mkShip('+o.id+')">발송 처리</button></div></div>';
    });
    h+='</div>';

    // --- 환불 대기 (불합격) ---
    var rf=orders.filter(function(o){return o.status==='failed';});
    if(rf.length){
      h+='<div class="card"><h3>환불 대기 <span class="pill off">'+rf.length+'건</span></h3>';
      rf.forEach(function(o){
        h+='<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">'
          +'<div><b>'+esc(o.title)+'</b> <span class="muted">'+esc(o.order_uid)+'</span></div>'
          +'<div class="muted">사유: '+esc(o.fail_reason||'')+' · 환불액 '+num(o.buyer_total)+'원</div>'
          +'<div class="row"><button class="warn" onclick="mkRefund('+o.id+')">환불 확정</button>'
          +'<button class="ghost" onclick="mkRefundRetry('+o.id+')">환불 재시도</button></div></div>';
      });
      h+='</div>';
    }

    // --- 전체 주문 ---
    h+='<div class="card"><h3>마켓 주문</h3><table><tr><th>#</th><th>상품</th><th>판매→구매</th>'
      +'<th>거래가</th><th>접수번호</th><th>상태</th></tr>';
    orders.forEach(function(o){
      h+='<tr><td>'+o.id+'</td><td>'+esc(o.title)+'</td>'
        +'<td class="muted">'+esc(o.seller_nickname)+' → '+esc(o.buyer_nickname)+'</td>'
        +'<td>'+num(o.item_price)+'원</td><td class="muted">'+esc(o.inbound_code||'-')+'</td>'
        +'<td>'+(MK_STATUS[o.status]||o.status)+'</td></tr>';
    });
    h+='</table></div>';
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}

function mkOrderOptions(){
  var wait=MK_ORDERS.filter(function(o){
    return o.status==='paid'||o.status==='awaiting_inbound'||o.status==='inbound';});
  if(!wait.length) return '<option value="">입고 대기 주문 없음</option>';
  return wait.map(function(o){
    return '<option value="'+o.id+'">#'+o.id+' '+esc(o.title)+' · '+esc(o.seller_nickname)+'</option>';
  }).join('');
}

function mkReceive(){
  var code=document.getElementById('mk_code').value;
  if(!clean(code)) return toast('박스에 적힌 값을 입력하세요');
  api('/admin/market/inbound/receive',{code:code}).then(function(r){
    toast('입고 처리됨: '+(r.order?r.order.title:''));
    document.getElementById('mk_code').value='';
    renderMarket();
  }).catch(function(e){
    // 후보가 여럿이거나 매칭 실패면 화면에 안내를 남긴다
    document.getElementById('mk_scan_result').innerHTML=
      '<p class="muted" style="margin-top:10px;color:#FF7A7A">'+esc(e.message)+'</p>';
    toast(e.message);
    renderMarket();
  });
}
function mkMatch(inboundId){
  var sel=document.getElementById('mk_match_'+inboundId);
  if(!sel.value) return toast('매칭할 주문을 선택하세요');
  api('/admin/market/inbound/'+inboundId+'/match',{order_id:+sel.value})
    .then(function(){toast('매칭 완료 → 검수 대기로 이동');renderMarket();}).catch(function(e){toast(e.message);});
}
function mkInspect(id,result){
  var reason=document.getElementById('mk_reason_'+id).value;
  if(result==='fail'&&!clean(reason)) return toast('불합격 사유를 입력하세요');
  if(result==='fail'&&!confirm('불합격 처리하면 구매자에게 전액 환불됩니다. 진행할까요?')) return;
  api('/admin/market/orders/'+id+'/inspect',{result:result,reason:reason||null})
    .then(function(r){toast(result==='pass'?'합격 · 정산 '+num(r.payout_amount)+'원 대기':'불합격 처리됨');renderMarket();})
    .catch(function(e){toast(e.message);});
}
function mkShip(id){
  var t=document.getElementById('mk_trk_'+id).value;
  if(!clean(t)) return toast('송장번호를 입력하세요');
  api('/admin/market/orders/'+id+'/ship',{tracking:t})
    .then(function(){toast('발송 처리됨');renderMarket();}).catch(function(e){toast(e.message);});
}
function mkRefund(id){
  if(!confirm('구매자에게 전액 환불합니다. 토스 결제 취소가 실제로 실행됩니다.')) return;
  api('/admin/market/orders/'+id+'/refund',{})
    .then(function(r){toast('환불 완료 '+num(r.refund_amount)+'원');renderMarket();})
    .catch(function(e){toast(e.message);});
}
function mkRefundRetry(id){
  api('/admin/market/orders/'+id+'/refund/retry',{})
    .then(function(r){toast(r.already?'이미 환불된 건입니다':'재시도 성공 '+num(r.refund_amount)+'원');renderMarket();})
    .catch(function(e){toast(e.message);});
}

// ==================== 정산 · 정책 ====================
function renderSettle(){
  Promise.all([api('/admin/market/payouts'),api('/admin/market/overview'),api('/admin/refunds')]).then(function(r){
    var ps=r[0],ov=r[1],st=ov.settings,rfs=r[2];
    var h='<div class="card"><h3>수수료 정책</h3>'
      +'<p class="muted" style="margin-top:6px">변경해도 기존 주문의 수수료는 바뀌지 않습니다(주문 시점 값 고정).</p>'
      +'<div class="row"><label class="muted">판매 수수료</label>'
      +'<input class="sm" id="set_fee" type="number" step="0.01" value="'+st.fee_rate+'"> <span class="muted">(0.08 = 8%)</span></div>'
      +'<div class="row"><label class="muted">검수비(판매자)</label>'
      +'<input class="sm" id="set_insp" type="number" value="'+st.inspection_fee+'"> 원</div>'
      +'<div class="row"><label class="muted">배송비(구매자)</label>'
      +'<input class="sm" id="set_ship" type="number" value="'+st.shipping_fee+'"> 원</div>'
      +'</div><div class="card"><h3>본인확인 정책</h3>'
      +'<p class="muted" style="margin-top:6px">강제로 켜면 본인확인을 마치지 않은 유저는 전원 미성년자 한도가 적용됩니다. '
      +'기존 가입자도 즉시 제한되므로 PASS 연동 후 켜세요.</p>'
      +'<div class="row"><span class="pill '+(st.identity_required?'off':'on')+'">'
      +(st.identity_required?'강제 (미인증자 제한)':'유예 (기존 저장값 인정)')+'</span>'
      +'<button class="ghost" onclick="setIdentity('+(st.identity_required?0:1)+')">'
      +(st.identity_required?'유예로 전환':'강제로 전환')+'</button></div>'
      +'<div class="row"><button onclick="saveSettings()">정책 저장</button>'
      +'<button class="ghost" onclick="toggleMarket('+(st.enabled?0:1)+')">'
      +(st.enabled?'마켓 판매 중단':'마켓 판매 재개')+'</button>'
      +'<span class="pill '+(st.enabled?'on':'off')+'">'+(st.enabled?'마켓 운영중':'마켓 중단')+'</span></div></div>';

    var pend=ps.filter(function(p){return p.status==='pending'||p.status==='approved';});
    h+='<div class="card"><h3>정산 대기 <span class="pill '+(pend.length?'off':'on')+'">'+pend.length+'건</span></h3>';
    if(!pend.length) h+='<p class="muted" style="margin-top:6px">정산 대기 건이 없습니다.</p>';
    pend.forEach(function(p){
      h+='<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">'
        +'<div><b>'+num(p.amount)+'원</b> · '+esc(p.seller_nickname)+' <span class="muted">'+esc(p.order_uid)+'</span></div>'
        +'<div class="muted">'+esc(p.title)+'</div>'
        +'<div class="muted">'+esc(p.bank||'계좌 미등록')+' '+esc(p.account||'')+' '+esc(p.holder||'')+'</div>'
        +'<div class="row">'
        +(p.status==='pending'?'<button onclick="payoutAct('+p.id+',\'approve\')">정산 승인</button>':'')
        +'<button class="ghost" onclick="payoutAct('+p.id+',\'paid\')">이체 완료</button>'
        +'<button class="warn" onclick="payoutAct('+p.id+',\'cancel\')">보류</button></div></div>';
    });
    h+='</div>';

    // 실패한 환불은 돈이 안 나간 상태라 가장 먼저 눈에 띄어야 한다
    var rfOpen=rfs.filter(function(x){return x.status!=='done';});
    h+='<div class="card"><h3>환불 원장 '
      +(rfOpen.length?'<span class="pill off">미처리 '+rfOpen.length+'건</span>':'<span class="pill on">정상</span>')+'</h3>';
    h+='<p class="muted" style="margin-top:6px">링크 결제는 API로 환불이 되지 않습니다. '
      +'결제 제공자 화면에서 실제로 돈을 돌려준 뒤 여기서 완료로 닫으세요. '
      +'<b>완료로 닫기 전까지는 돈이 나가지 않은 상태</b>입니다.</p>';
    h+='<table><tr><th>#</th><th>구분</th><th>주문</th><th>금액</th><th>상태</th><th>사유</th><th></th></tr>';
    rfs.forEach(function(x){
      h+='<tr><td>'+x.id+'</td><td>'+(x.kind==='pack'?'랜덤팩':'마켓')+'</td>'
        +'<td class="muted">'+esc(x.order_ref||('#'+(x.order_id||'-')))+'</td>'
        +'<td>'+num(x.amount)+'원</td>'
        +'<td>'+({pending:'진행중',requested:'환불 필요',done:'환불 완료',failed:'실패'}[x.status]||x.status)+'</td>'
        +'<td class="muted">'+esc(x.reason||'')+'</td><td>'
        +(x.status==='done'?'<span class="muted">'+esc(x.done_at||'')+'</span>'
          :'<button onclick="refundDone('+x.id+')">환불 완료</button>')
        +'</td></tr>';
    });
    h+='</table></div>';

    h+='<div class="card"><h3>정산 내역</h3><table><tr><th>#</th><th>판매자</th><th>금액</th><th>상태</th><th>지급일</th></tr>';
    ps.forEach(function(p){
      h+='<tr><td>'+p.id+'</td><td>'+esc(p.seller_nickname)+'</td><td>'+num(p.amount)+'원</td>'
        +'<td>'+({pending:'대기',approved:'승인',paid:'지급완료',cancelled:'보류'}[p.status]||p.status)+'</td>'
        +'<td class="muted">'+esc(p.paid_at||'-')+'</td></tr>';
    });
    h+='</table></div>';
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}
function refundDone(id){
  var memo=prompt('실제로 환불을 보내셨나요? 처리 메모를 남겨주세요 (예: 블로그페이에서 취소 처리)','');
  if(memo===null) return;
  api('/admin/refunds/'+id+'/done',{memo:memo})
    .then(function(){toast('환불 원장 종료');renderSettle();}).catch(function(e){toast(e.message);});
}
function saveSettings(){
  api('/admin/settings',{
    market_fee_rate:document.getElementById('set_fee').value,
    market_inspection_fee:document.getElementById('set_insp').value,
    market_shipping_fee:document.getElementById('set_ship').value
  }).then(function(){toast('정책 저장됨');renderSettle();}).catch(function(e){toast(e.message);});
}
function setIdentity(on){
  if(on&&!confirm('본인확인을 마치지 않은 기존 유저 전원에게 미성년자 한도(10만원/일)가 즉시 적용됩니다. 진행할까요?')) return;
  api('/admin/settings',{identity_required:String(on)})
    .then(function(){toast(on?'본인확인 강제 적용':'유예 모드로 전환');renderSettle();}).catch(function(e){toast(e.message);});
}
function toggleMarket(on){
  api('/admin/settings',{market_enabled:String(on)})
    .then(function(){toast(on?'마켓 재개':'마켓 중단');renderSettle();}).catch(function(e){toast(e.message);});
}

if(TOKEN) boot();
</script>
</body>
</html>
