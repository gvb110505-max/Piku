<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piku 관리자</title>
<style>
  :root{--bg:#0A0A0C;--card:#131318;--line:#23232B;--text:#F5F5F7;--sub:#96969E;--gold:#F2C558;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:14px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:24px;font-weight:900;font-style:italic}
  .tabs{display:flex;gap:4px;margin:20px 0;border-bottom:1px solid var(--line)}
  .tab{padding:10px 16px;color:var(--sub);font-weight:800;cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-bottom-color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .v{font-size:24px;font-weight:900;color:var(--gold);margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .muted{color:var(--sub);font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{color:var(--sub);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px}
  input.sm{width:80px}
  button{background:var(--gold);border:0;border-radius:8px;color:#111;font-weight:900;padding:8px 14px;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.warn{background:#2A1A1F;color:#FF7A7A;border:1px solid #4A2A33}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#F7DC8D,#C8992F)}
  .pill{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:900}
  .pill.on{background:#14291C;color:#5CFF9D}.pill.off{background:#2A1A1F;color:#FF7A7A}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .gate{max-width:360px;margin:120px auto;text-align:center}
  .gate input{width:100%;margin:16px 0 10px;padding:12px}
  .gate button{width:100%;padding:12px}
  #diag{display:none;text-align:left;white-space:pre-wrap;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;font-size:11px;line-height:1.6;color:var(--sub);max-height:50vh;overflow:auto}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:10px 20px;font-weight:800;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>PIKU 관리자</h1>
  <input id="tokenInput" type="password" placeholder="관리자 비밀번호" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
  <button onclick="login()">접속</button>
  <p class="muted" style="margin-top:10px">Vercel의 ADMIN_TOKEN 값 (기본: dev-admin)</p>
  <p class="muted" style="margin-top:4px">빌드 __BUILD__</p>
  <button class="ghost" style="margin-top:14px" onclick="diagnose()">서버 진단</button>
  <pre id="diag"></pre>
</div>

<div id="app" class="wrap" style="display:none">
  <h1>PIKU 관리자</h1>
  <div class="tabs">
    <div class="tab on" data-t="dash" onclick="go('dash')">대시보드</div>
    <div class="tab" data-t="packs" onclick="go('packs')">팩·상품</div>
    <div class="tab" data-t="ship" onclick="go('ship')">배송</div>
    <div class="tab" data-t="orders" onclick="go('orders')">주문·유저</div>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script>
// 아이폰 자동변환/자동완성으로 붙는 앞뒤 공백·개행 제거 (비번 자체는 건드리지 않는다)
function clean(v){ return (v||'').trim(); }
// 사파리 프라이빗 모드에서는 localStorage 접근 자체가 예외를 던진다 → 감싼다
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} return null; }
var TOKEN = clean(store('admin_token'));
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(n){ return Number(n||0).toLocaleString('ko-KR'); }
function toast(m){ var t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){t.style.display='none';},2600); }

// r.json()을 쓰면 서버가 JSON이 아닌 응답(플랫폼 HTML 오류 페이지, 504 등)을 줬을 때
// 사파리가 "The string did not match the expected pattern."이라는 정체불명 에러만 던진다.
// → 항상 text()로 받아서 직접 파싱하고, 실패하면 상태코드와 본문 앞부분을 그대로 노출한다.
function api(path, body){
  var url = path + (path.indexOf('?')>=0?'&':'?') + 'token=' + encodeURIComponent(TOKEN)
    + '&_=' + Date.now(); // 캐시 우회
  var opt = { method: body?'POST':'GET', cache:'no-store', headers:{} };
  if(body){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  return fetch(url,opt).then(function(r){
    return r.text().then(function(text){ return { status:r.status, ok:r.ok, text:text }; });
  },function(netErr){
    throw new Error('서버에 연결하지 못했어요 ('+(netErr&&netErr.message||netErr)+')');
  }).then(function(res){
    var data=null, parsed=true;
    try { data = JSON.parse(res.text); } catch(e){ parsed=false; }
    if(!parsed){
      throw new Error('서버가 JSON이 아닌 응답을 보냈어요 · HTTP '+res.status+' · '
        + (res.text ? res.text.replace(/\s+/g,' ').slice(0,180) : '(빈 응답)'));
    }
    if(res.status===403){ logout(); throw new Error('비밀번호가 올바르지 않아요 (서버가 거부)'); }
    if(!res.ok) throw new Error((data.message||data.error||'요청 실패')+' · HTTP '+res.status);
    return data;
  });
}

// 로그인이 안 될 때 원인을 계층별로 잘라서 보여준다: 라우팅 → DB → 토큰
function diagnose(){
  var box=document.getElementById('diag');
  box.style.display='block';
  box.textContent='진단 중...\n';
  var typed=clean(document.getElementById('tokenInput').value);
  function probe(label,path){
    return fetch(path+'&_='+Date.now(),{cache:'no-store'}).then(function(r){
      return r.text().then(function(t){
        box.textContent += '\n[' + label + '] HTTP ' + r.status + '\n'
          + (r.headers.get('content-type')||'(content-type 없음)') + '\n'
          + (t ? t.replace(/\s+/g,' ').slice(0,400) : '(빈 응답)') + '\n';
      });
    }).catch(function(e){
      box.textContent += '\n[' + label + '] 요청 실패: ' + (e&&e.message||e) + '\n';
    });
  }
  box.textContent = 'page: ' + location.href + '\n';
  probe('health','/health?x=1')
    .then(function(){ return probe('admin/ping (입력한 비번)','/admin/ping?token='+encodeURIComponent(typed)); })
    .then(function(){ return probe('admin/overview (입력한 비번)','/admin/overview?token='+encodeURIComponent(typed)); })
    .then(function(){ box.textContent += '\n— 진단 끝. 이 내용을 그대로 복사해서 보내주세요.'; });
}
function login(){ TOKEN=clean($('#tokenInput').value); store('admin_token',TOKEN); boot(); }
function logout(){ store('admin_token',null); $('#app').style.display='none'; $('#gate').style.display='block'; }
function boot(){
  api('/admin/overview').then(function(){
    $('#gate').style.display='none'; $('#app').style.display='block';
    var d=$('#diag'); if(d) d.style.display='none';
    go('dash');
  }).catch(function(e){
    toast(e.message);
    var d=$('#diag');
    if(d){ d.style.display='block'; d.textContent='로그인 실패\n\n'+e.message
      +'\n\n원인이 명확하지 않으면 아래 "서버 진단"을 눌러 결과를 보내주세요.'; }
  });
}
function go(t){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on',tabs[i].dataset.t===t);
  ({dash:renderDash,packs:renderPacks,ship:renderShip,orders:renderOrders})[t]();
}

function renderDash(){
  api('/admin/overview').then(function(o){
    var h='<div class="grid">'
      +'<div class="stat"><div class="muted">총 매출</div><div class="v">'+num(o.sales_total)+'원</div></div>'
      +'<div class="stat"><div class="muted">주문 수</div><div class="v">'+num(o.order_count)+'</div></div>'
      +'<div class="stat"><div class="muted">가입 유저</div><div class="v">'+num(o.user_count)+'</div></div>'
      +'<div class="stat"><div class="muted">미발송 배송</div><div class="v">'+num(o.pending_shipments)+'</div></div></div>';
    o.packs.forEach(function(p){
      var sold=p.sold_slots,total=p.total_slots,left=total-sold;
      var hitLeft=p.hits.reduce(function(s,x){return s+x.remaining;},0);
      h+='<div class="card"><h3>'+esc(p.name)
        +' <span class="pill '+(p.active?'on':'off')+'">'+(p.active?'판매중':'중단/품절')+'</span>'
        +' <span class="muted">'+(p.is_welcome?num(p.point_price)+'P 웰컴팩':num(p.price)+'원')+' · 주문 '+p.orders+'건</span></h3>'
        +'<div class="bar"><i style="width:'+(total?sold/total*100:0)+'%"></i></div>'
        +'<div class="muted" style="margin-top:6px">판매 '+sold+'/'+total+' 슬롯 · 남은 HIT '+hitLeft+'개</div>'
        +'<table><tr><th>HIT</th><th>잔여</th><th>확률</th><th>교환P</th></tr>';
      p.hits.forEach(function(x){
        h+='<tr><td>'+esc(x.name)+'</td><td>'+x.remaining+'/'+x.total_qty+'</td>'
          +'<td>'+(left>0?(x.remaining/left*100).toFixed(2):'0.00')+'%</td><td>'+num(x.point_value)+'P</td></tr>';
      });
      h+='</table></div>';
    });
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}

function renderPacks(){
  api('/admin/overview').then(function(o){
    var h='<div class="card"><h3>새 팩 만들기</h3><div class="row">'
      +'<input id="np_name" placeholder="팩 이름">'
      +'<input id="np_price" class="sm" type="number" placeholder="가격(원)">'
      +'<input id="np_slots" class="sm" type="number" placeholder="총 슬롯">'
      +'<button onclick="createPack()">생성</button></div>'
      +'<p class="muted" style="margin-top:8px">원가율 35% 설계: 총 슬롯 ≈ HIT 원가 합 ÷ (판매가 × 0.35)</p></div>';
    o.packs.forEach(function(p){
      h+='<div class="card"><h3>'+esc(p.name)+' <span class="pill '+(p.active?'on':'off')+'">'+(p.active?'판매중':'중단')+'</span></h3>'
        +'<div class="row"><label class="muted">총 슬롯</label>'
        +'<input class="sm" type="number" value="'+p.total_slots+'" id="slots_'+p.id+'">'
        +'<button class="ghost" onclick="updPack('+p.id+',{total_slots:+document.getElementById(\'slots_'+p.id+'\').value})">저장</button>'
        +'<button class="ghost" onclick="updPack('+p.id+',{active:'+(p.active?0:1)+'})">'+(p.active?'판매 중단':'판매 재개')+'</button></div>'
        +'<table><tr><th>HIT</th><th>잔여</th><th>총량</th><th>교환P</th><th></th></tr>';
      p.hits.forEach(function(x){
        h+='<tr><td>'+esc(x.name)+'</td>'
          +'<td><input class="sm" type="number" value="'+x.remaining+'" id="hr_'+x.id+'"></td>'
          +'<td><input class="sm" type="number" value="'+x.total_qty+'" id="ht_'+x.id+'"></td>'
          +'<td><input class="sm" type="number" value="'+x.point_value+'" id="hp_'+x.id+'"> P</td>'
          +'<td><button class="ghost" onclick="updHit('+x.id+')">저장</button></td></tr>';
      });
      h+='</table><div class="row"><input id="nh_name_'+p.id+'" placeholder="새 HIT 이름">'
        +'<input id="nh_qty_'+p.id+'" class="sm" type="number" placeholder="수량">'
        +'<input id="nh_pv_'+p.id+'" class="sm" type="number" placeholder="교환P">'
        +'<input id="nh_cost_'+p.id+'" class="sm" type="number" placeholder="원가">'
        +'<button onclick="addHit('+p.id+')">HIT 추가</button></div>'
        +'<table><tr><th>POINT 풀</th><th>등급</th><th>가중치</th><th></th></tr>';
      p.pool.forEach(function(c){
        h+='<tr><td>'+esc(c.name)+'</td><td>'+c.rarity+'</td><td>'+c.weight+'</td>'
          +'<td><button class="warn" onclick="delPool('+c.id+')">삭제</button></td></tr>';
      });
      h+='</table><div class="row"><input id="pc_name_'+p.id+'" placeholder="카드 이름">'
        +'<select id="pc_r_'+p.id+'"><option value="common">커먼</option><option value="uncommon">언커먼</option><option value="rare">레어</option></select>'
        +'<input id="pc_w_'+p.id+'" class="sm" type="number" value="10">'
        +'<button onclick="addPool('+p.id+')">POINT 카드 추가</button></div></div>';
    });
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}
function createPack(){
  api('/admin/packs',{name:$('#np_name').value,price:+$('#np_price').value,total_slots:+$('#np_slots').value})
    .then(function(){toast('팩 생성 완료');renderPacks();}).catch(function(e){toast(e.message);});
}
function updPack(id,body){ api('/admin/packs/'+id,body).then(function(){toast('저장됨');renderPacks();}).catch(function(e){toast(e.message);}); }
function updHit(id){
  api('/admin/hits/'+id,{remaining:+document.getElementById('hr_'+id).value,
    total_qty:+document.getElementById('ht_'+id).value,point_value:+document.getElementById('hp_'+id).value})
    .then(function(){toast('HIT 저장됨');renderPacks();}).catch(function(e){toast(e.message);});
}
function addHit(pid){
  api('/admin/packs/'+pid+'/hits',{name:document.getElementById('nh_name_'+pid).value,
    total_qty:+document.getElementById('nh_qty_'+pid).value,point_value:+document.getElementById('nh_pv_'+pid).value,
    cost:+document.getElementById('nh_cost_'+pid).value||0})
    .then(function(){toast('HIT 추가됨');renderPacks();}).catch(function(e){toast(e.message);});
}
function addPool(pid){
  api('/admin/packs/'+pid+'/pool',{name:document.getElementById('pc_name_'+pid).value,
    rarity:document.getElementById('pc_r_'+pid).value,weight:+document.getElementById('pc_w_'+pid).value||1})
    .then(function(){toast('추가됨');renderPacks();}).catch(function(e){toast(e.message);});
}
function delPool(id){ api('/admin/pool/'+id+'/delete',{}).then(function(){toast('삭제됨');renderPacks();}).catch(function(e){toast(e.message);}); }

function renderShip(){
  api('/admin/shipments').then(function(rows){
    var label={requested:'신청 접수',preparing:'준비 중',shipped:'발송 완료'};
    var h= rows.length? '' : '<p class="muted">배송 신청이 없어요</p>';
    rows.forEach(function(s){
      var cards=s.cards.map(function(c){return '<span class="pill" style="background:#1D1D26;color:var(--text);margin-right:6px">'+esc(c.name)+' ('+c.grade+')</span>';}).join('');
      h+='<div class="card"><h3>#'+s.id+' · '+esc(s.nickname)+' <span class="muted">'+esc(s.phone)+'</span>'
        +' <span class="pill '+(s.status==='shipped'?'on':'off')+'">'+(label[s.status]||s.status)+'</span></h3>'
        +'<div class="muted" style="margin-top:6px">'+esc(s.address)+' · 배송비 '+num(s.fee)+'원</div>'
        +'<div style="margin-top:8px">'+cards+'</div>'
        +'<div class="row"><input id="trk_'+s.id+'" placeholder="운송장 번호" value="'+esc(s.tracking||'')+'">'
        +'<button class="ghost" onclick="shipUpd('+s.id+',\'preparing\')">준비 중</button>'
        +'<button onclick="shipUpd('+s.id+',\'shipped\')">발송 완료</button></div></div>';
    });
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}
function shipUpd(id,status){
  api('/admin/shipments/'+id,{status:status,tracking:document.getElementById('trk_'+id).value||null})
    .then(function(){toast('배송 상태 변경됨');renderShip();}).catch(function(e){toast(e.message);});
}

function renderOrders(){
  Promise.all([api('/admin/orders'),api('/admin/users')]).then(function(res){
    var orders=res[0],users=res[1];
    var h='<div class="card"><h3>최근 주문</h3><table><tr><th>#</th><th>유저</th><th>팩</th><th>금액</th><th>수단</th></tr>';
    orders.forEach(function(o){
      h+='<tr><td>'+o.id+'</td><td>'+esc(o.nickname)+'</td><td>'+esc(o.pack_name)+'</td><td>'+num(o.amount)+'원</td><td>'+esc(o.method)+'</td></tr>';
    });
    h+='</table></div><div class="card"><h3>유저</h3><table><tr><th>#</th><th>닉네임</th><th>전화</th><th>포인트</th><th>주문</th><th>누적 결제</th></tr>';
    users.forEach(function(u){
      h+='<tr><td>'+u.id+'</td><td>'+esc(u.nickname)+'</td><td class="muted">'+esc(u.phone)+'</td><td>'+num(u.points)+'P</td><td>'+u.order_count+'</td><td>'+num(u.spent)+'원</td></tr>';
    });
    h+='</table></div>';
    $('#view').innerHTML=h;
  }).catch(function(e){ toast(e.message); });
}

if(TOKEN) boot();
</script>
</body>
</html>
