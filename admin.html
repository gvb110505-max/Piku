<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piku 관리자</title>
<style>
  :root{--bg:#0B0B0F;--card:#15151C;--line:#26262F;--text:#F4F4F6;--sub:#9A9AA6;--pink:#FF5C8A;--gold:#FFD166;--blue:#5CC8FF;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;font-size:14px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:24px;font-weight:900;letter-spacing:1px}
  h1 span{color:var(--pink)}
  .tabs{display:flex;gap:4px;margin:20px 0;border-bottom:1px solid var(--line)}
  .tab{padding:10px 16px;color:var(--sub);font-weight:800;cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-bottom-color:var(--pink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .v{font-size:24px;font-weight:900;color:var(--gold);margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .muted{color:var(--sub);font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{color:var(--sub);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px}
  input.sm{width:80px}
  button{background:var(--pink);border:0;border-radius:8px;color:#111;font-weight:900;padding:8px 14px;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.warn{background:#2A1A1F;color:#FF7A7A;border:1px solid #4A2A33}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#7C5CFF)}
  .pill{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:900}
  .pill.on{background:#14291C;color:#5CFF9D}.pill.off{background:#2A1A1F;color:#FF7A7A}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .gate{max-width:360px;margin:120px auto;text-align:center}
  .gate input{width:100%;margin:16px 0 10px;padding:12px}
  .gate button{width:100%;padding:12px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--pink);border-radius:10px;padding:10px 20px;font-weight:800;display:none}
  @media (max-width:600px){td,th{padding:6px 4px}.wrap{padding:16px 10px 60px}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>PIKU 관리자</h1>
  <input id="tokenInput" type="password" placeholder="관리자 토큰">
  <button onclick="login()">접속</button>
  <p class="muted" style="margin-top:10px">서버 ADMIN_TOKEN 환경변수 값 (기본: dev-admin)</p>
</div>

<div id="app" class="wrap" style="display:none">
  <h1>PIKU 관리자</h1>
  <div class="tabs">
    <div class="tab on" data-t="dash" onclick="go('dash')">대시보드</div>
    <div class="tab" data-t="packs" onclick="go('packs')">팩·상품</div>
    <div class="tab" data-t="ship" onclick="go('ship')">배송</div>
    <div class="tab" data-t="orders" onclick="go('orders')">주문·유저</div>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script>
let TOKEN = localStorage.getItem('admin_token') || '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (n) => Number(n || 0).toLocaleString('ko-KR');

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', 'x-admin-token': TOKEN },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 403) { logout(); throw new Error('토큰이 올바르지 않아요'); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || '요청 실패');
  return d;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',1800); }
function login(){ TOKEN=$('#tokenInput').value.trim(); localStorage.setItem('admin_token',TOKEN); boot(); }
function logout(){ localStorage.removeItem('admin_token'); $('#app').style.display='none'; $('#gate').style.display='block'; }
async function boot(){
  try { await api('/admin/overview'); $('#gate').style.display='none'; $('#app').style.display='block'; go('dash'); }
  catch(e){ toast(e.message); }
}

let CUR='dash';
function go(t){ CUR=t; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ({dash:renderDash, packs:renderPacks, ship:renderShip, orders:renderOrders})[t](); }

// ---------- 대시보드 ----------
async function renderDash(){
  const o = await api('/admin/overview');
  let h = `<div class="grid">
    <div class="stat"><div class="muted">총 매출</div><div class="v">${num(o.sales_total)}원</div></div>
    <div class="stat"><div class="muted">주문 수</div><div class="v">${num(o.order_count)}</div></div>
    <div class="stat"><div class="muted">가입 유저</div><div class="v">${num(o.user_count)}</div></div>
    <div class="stat"><div class="muted">미발송 배송</div><div class="v">${num(o.pending_shipments)}</div></div>
  </div>`;
  for (const p of o.packs) {
    const sold = p.sold_slots, total = p.total_slots, left = total - sold;
    const hitLeft = p.hits.reduce((s,x)=>s+x.remaining,0);
    const hitCost = p.hits.reduce((s,x)=>s+x.cost*x.remaining,0);
    const costRate = p.price>0 && left>0 ? (hitCost/(p.price*left)*100).toFixed(1) : null;
    h += `<div class="card">
      <h3>${esc(p.name)}
        <span class="pill ${p.active?'on':'off'}">${p.active?'판매중':'중단/품절'}</span>
        <span class="muted">${p.is_welcome?`${num(p.point_price)}P 웰컴팩`:num(p.price)+'원'} · 주문 ${p.orders}건</span>
      </h3>
      <div class="bar"><i style="width:${total?sold/total*100:0}%"></i></div>
      <div class="muted" style="margin-top:6px">판매 ${sold}/${total} 슬롯 · 남은 HIT ${hitLeft}개
        ${costRate!==null?` · 잔여분 기대 원가율(HIT 기준) ${costRate}%`:''}</div>
      <table><tr><th>HIT</th><th>잔여</th><th>확률</th><th>교환P</th></tr>
        ${p.hits.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.remaining}/${x.total_qty}</td>
          <td>${left>0?(x.remaining/left*100).toFixed(2):'0.00'}%</td><td>${num(x.point_value)}P</td></tr>`).join('')}
      </table></div>`;
  }
  $('#view').innerHTML = h;
}

// ---------- 팩·상품 관리 ----------
async function renderPacks(){
  const o = await api('/admin/overview');
  let h = `<div class="card"><h3>새 팩 만들기</h3><div class="row">
    <input id="np_name" placeholder="팩 이름">
    <input id="np_price" class="sm" type="number" placeholder="가격(원)">
    <input id="np_slots" class="sm" type="number" placeholder="총 슬롯">
    <button onclick="createPack()">생성</button></div>
    <p class="muted" style="margin-top:8px">원가율 35% 설계: 총 슬롯 ≈ HIT 원가 합 ÷ (판매가 × 0.35)</p></div>`;
  for (const p of o.packs) {
    h += `<div class="card"><h3>${esc(p.name)}
      <span class="pill ${p.active?'on':'off'}">${p.active?'판매중':'중단'}</span></h3>
      <div class="row">
        <label class="muted">총 슬롯</label><input class="sm" type="number" value="${p.total_slots}" id="slots_${p.id}">
        <button class="ghost" onclick="updPack(${p.id},{total_slots:+document.getElementById('slots_${p.id}').value})">저장</button>
        <button class="ghost" onclick="updPack(${p.id},{active:${p.active?0:1}})">${p.active?'판매 중단':'판매 재개'}</button>
      </div>

      <table><tr><th>HIT</th><th>잔여</th><th>총량</th><th>포인트 교환비율</th><th></th></tr>
      ${p.hits.map(x=>`<tr><td>${esc(x.name)}</td>
        <td><input class="sm" type="number" value="${x.remaining}" id="hr_${x.id}"></td>
        <td><input class="sm" type="number" value="${x.total_qty}" id="ht_${x.id}"></td>
        <td><input class="sm" type="number" value="${x.point_value}" id="hp_${x.id}"> P</td>
        <td><button class="ghost" onclick="updHit(${x.id})">저장</button></td></tr>`).join('')}
      </table>
      <div class="row"><input id="nh_name_${p.id}" placeholder="새 HIT 이름">
        <input id="nh_qty_${p.id}" class="sm" type="number" placeholder="수량">
        <input id="nh_pv_${p.id}" class="sm" type="number" placeholder="교환P">
        <input id="nh_cost_${p.id}" class="sm" type="number" placeholder="원가">
        <button onclick="addHit(${p.id})">HIT 추가</button></div>

      <table><tr><th>POINT 풀</th><th>등급</th><th>가중치</th><th></th></tr>
      ${p.pool.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.rarity}</td><td>${c.weight}</td>
        <td><button class="warn" onclick="delPool(${c.id})">삭제</button></td></tr>`).join('')}
      </table>
      <div class="row"><input id="pc_name_${p.id}" placeholder="카드 이름">
        <select id="pc_r_${p.id}"><option value="common">커먼</option><option value="uncommon">언커먼</option><option value="rare">레어</option></select>
        <input id="pc_w_${p.id}" class="sm" type="number" placeholder="가중치" value="10">
        <button onclick="addPool(${p.id})">POINT 카드 추가</button></div>
    </div>`;
  }
  $('#view').innerHTML = h;
}
async function createPack(){
  try{ await api('/admin/packs',{name:$('#np_name').value,price:+$('#np_price').value,total_slots:+$('#np_slots').value});
    toast('팩 생성 완료'); renderPacks(); }catch(e){ toast(e.message); }
}
async function updPack(id,body){ try{ await api('/admin/packs/'+id,body); toast('저장됨'); renderPacks(); }catch(e){ toast(e.message);} }
async function updHit(id){
  try{ await api('/admin/hits/'+id,{ remaining:+document.getElementById('hr_'+id).value,
    total_qty:+document.getElementById('ht_'+id).value, point_value:+document.getElementById('hp_'+id).value });
    toast('HIT 저장됨'); renderPacks(); }catch(e){ toast(e.message); }
}
async function addHit(pid){
  try{ await api(`/admin/packs/${pid}/hits`,{ name:document.getElementById('nh_name_'+pid).value,
    total_qty:+document.getElementById('nh_qty_'+pid).value, point_value:+document.getElementById('nh_pv_'+pid).value,
    cost:+document.getElementById('nh_cost_'+pid).value||0 });
    toast('HIT 추가됨'); renderPacks(); }catch(e){ toast(e.message); }
}
async function addPool(pid){
  try{ await api(`/admin/packs/${pid}/pool`,{ name:document.getElementById('pc_name_'+pid).value,
    rarity:document.getElementById('pc_r_'+pid).value, weight:+document.getElementById('pc_w_'+pid).value||1 });
    toast('추가됨'); renderPacks(); }catch(e){ toast(e.message); }
}
async function delPool(id){ try{ await api('/admin/pool/'+id+'/delete',{}); toast('삭제됨'); renderPacks(); }catch(e){ toast(e.message);} }

// ---------- 배송 ----------
async function renderShip(){
  const rows = await api('/admin/shipments');
  const label = {requested:'신청 접수',preparing:'준비 중',shipped:'발송 완료'};
  let h = '';
  if(!rows.length) h = '<p class="muted">배송 신청이 없어요</p>';
  for (const s of rows) {
    h += `<div class="card"><h3>#${s.id} · ${esc(s.nickname)} <span class="muted">${esc(s.phone)}</span>
      <span class="pill ${s.status==='shipped'?'on':'off'}">${label[s.status]||s.status}</span></h3>
      <div class="muted" style="margin-top:6px">${esc(s.address)} · 배송비 ${num(s.fee)}원 · ${esc(s.created_at)}</div>
      <div style="margin-top:8px">${s.cards.map(c=>`<span class="pill" style="background:#1D1D26;color:var(--text);margin-right:6px">${esc(c.name)} (${c.grade})</span>`).join('')}</div>
      <div class="row">
        <input id="trk_${s.id}" placeholder="운송장 번호" value="${esc(s.tracking||'')}">
        <button class="ghost" onclick="shipUpd(${s.id},'preparing')">준비 중</button>
        <button onclick="shipUpd(${s.id},'shipped')">발송 완료 처리</button>
      </div></div>`;
  }
  $('#view').innerHTML = h;
}
async function shipUpd(id,status){
  try{ await api('/admin/shipments/'+id,{status,tracking:document.getElementById('trk_'+id).value||null});
    toast('배송 상태 변경됨'); renderShip(); }catch(e){ toast(e.message); }
}

// ---------- 주문·유저 ----------
async function renderOrders(){
  const [orders, users] = await Promise.all([api('/admin/orders'), api('/admin/users')]);
  $('#view').innerHTML = `
    <div class="card"><h3>최근 주문</h3><table>
      <tr><th>#</th><th>유저</th><th>팩</th><th>금액</th><th>수단</th><th>일시</th></tr>
      ${orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.nickname)}</td><td>${esc(o.pack_name)}</td>
        <td>${num(o.amount)}원</td><td>${esc(o.method)}</td><td class="muted">${esc(o.created_at)}</td></tr>`).join('')}
    </table></div>
    <div class="card"><h3>유저</h3><table>
      <tr><th>#</th><th>닉네임</th><th>전화</th><th>포인트</th><th>주문</th><th>누적 결제</th><th>웰컴팩</th></tr>
      ${users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.nickname)}</td><td class="muted">${esc(u.phone)}</td>
        <td>${num(u.points)}P</td><td>${u.order_count}</td><td>${num(u.spent)}원</td>
        <td>${u.welcome_used?'사용':'미사용'}</td></tr>`).join('')}
    </table></div>`;
}

if (TOKEN) boot();
</script>
</body>
</html>
